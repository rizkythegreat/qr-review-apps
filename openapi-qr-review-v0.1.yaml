        id:
          type: string
          format: uuid
        token:
          $ref: '#/components/schemas/PublicToken'
        status:
          $ref: '#/components/schemas/QrStatus'
        store_name:
          type: string
          minLength: 1
          maxLength: 120
          example: Kopi Bahagia
          description: Trim whitespace tepi; panjang dihitung setelah trim.
        review_url:
          $ref: '#/components/schemas/ReviewUrl'
        version:
          type: integer
          minimum: 1
        ownership_id:
          type: string
          format: uuid
        activated_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
