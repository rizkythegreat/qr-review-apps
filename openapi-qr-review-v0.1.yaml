      - reference
      - sold_at
    Sale:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        qr_id:
          type: string
          format: uuid
        reference:
          type: string
        sold_at:
          type: string
          format: date-time
        buyer_name:
          type: string
          nullable: true
