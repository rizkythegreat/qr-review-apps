              description: 'Semua JSON, HTML dan unduhan: no-store. Semua resolver responses: no-store, max-age=0.
                CDN harus bypass cache.'
              schema:
                type: string
                example: no-store, max-age=0
            X-Request-Id:
              description: ID tracing nonrahasia; sama dengan request_id JSON.
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
                description: HTML halaman Next.js berbahasa Indonesia; bukan JSON.
        '302':
          description: QR aktif; pindah ke Google Review, tanpa body.
          headers:
            Cache-Control:
              description: 'Semua JSON, HTML dan unduhan: no-store. Semua resolver responses: no-store, max-age=0.
                CDN harus bypass cache.'
              schema:
                type: string
                example: no-store, max-age=0
            X-Request-Id:
              description: ID tracing nonrahasia; sama dengan request_id JSON.
              schema:
                type: string
            Location:
              description: Review URL tersimpan yang sudah divalidasi; tidak menerima redirect query.
              schema:
                $ref: '#/components/schemas/ReviewUrl'
        '404':
          description: QR tidak ditemukan.
          headers:
            Cache-Control:
              description: 'Semua JSON, HTML dan unduhan: no-store. Semua resolver responses: no-store, max-age=0.
                CDN harus bypass cache.'
              schema:
                type: string
                example: no-store, max-age=0
            X-Request-Id:
              description: ID tracing nonrahasia; sama dengan request_id JSON.
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
                description: HTML halaman Next.js berbahasa Indonesia; bukan JSON.
        '410':
          description: QR retired.
          headers:
            Cache-Control:
              description: 'Semua JSON, HTML dan unduhan: no-store. Semua resolver responses: no-store, max-age=0.
                CDN harus bypass cache.'
              schema:
                type: string
                example: no-store, max-age=0
            X-Request-Id:
              description: ID tracing nonrahasia; sama dengan request_id JSON.
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
                description: HTML halaman Next.js berbahasa Indonesia; bukan JSON.
        '429':
          description: Terlalu banyak request.
          headers:
            Cache-Control:
              description: 'Semua JSON, HTML dan unduhan: no-store. Semua resolver responses: no-store, max-age=0.
                CDN harus bypass cache.'
              schema:
                type: string
                example: no-store, max-age=0
            X-Request-Id:
              description: ID tracing nonrahasia; sama dengan request_id JSON.
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            text/html:
              schema:
                type: string
                description: HTML halaman Next.js berbahasa Indonesia; bukan JSON.
        '503':
          description: Database/resolver tidak tersedia; coba lagi.
          headers:
            Cache-Control:
              description: 'Semua JSON, HTML dan unduhan: no-store. Semua resolver responses: no-store, max-age=0.
                CDN harus bypass cache.'
              schema:
                type: string
                example: no-store, max-age=0
            X-Request-Id:
              description: ID tracing nonrahasia; sama dengan request_id JSON.
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
                minimum: 1
                example: 5
          content:
            text/html:
              schema:
                type: string
                description: HTML halaman Next.js berbahasa Indonesia; bukan JSON.
    head:
      operationId: headQr
      summary: Periksa QR tanpa hitungan
      description: 'ACTIVE: 302 sementara ke review_url. UNACTIVATED: 200 halaman belum aktif, form tersedia untuk stok GENERATED, AVAILABLE atau SOLD.
        SUSPENDED: 200 fallback tanpa tujuan Google. RETIRED: 410 fallback. Tidak dikenal: 404. DB gagal: 503 coba
        lagi, tidak membuka aktivasi. HEAD mempunyai status/header yang sama tanpa body dan tidak dicatat. Preview
        tujuan gunakan URL dari halaman kelola langsung, bukan resolver. Semua response no-store, max-age=0; analytics
        tidak boleh menentukan apakah redirect berhasil.'
      tags:
      - Resolver
      security: []
      parameters:
      - $ref: '#/components/parameters/Token'
      responses:
        '200':
          description: Halaman belum aktif atau ditangguhkan.
          headers:
            Cache-Control:
              description: 'Semua JSON, HTML dan unduhan: no-store. Semua resolver responses: no-store, max-age=0.
                CDN harus bypass cache.'
              schema:
                type: string
                example: no-store, max-age=0
            X-Request-Id:
              description: ID tracing nonrahasia; sama dengan request_id JSON.
              schema:
                type: string
        '302':
          description: QR aktif; pindah ke Google Review, tanpa body.
          headers:
            Cache-Control:
              description: 'Semua JSON, HTML dan unduhan: no-store. Semua resolver responses: no-store, max-age=0.
                CDN harus bypass cache.'
              schema:
                type: string
                example: no-store, max-age=0
            X-Request-Id:
              description: ID tracing nonrahasia; sama dengan request_id JSON.
              schema:
                type: string
            Location:
              description: Review URL tersimpan yang sudah divalidasi; tidak menerima redirect query.
              schema:
                $ref: '#/components/schemas/ReviewUrl'
        '404':
          description: QR tidak ditemukan.
          headers:
            Cache-Control:
              description: 'Semua JSON, HTML dan unduhan: no-store. Semua resolver responses: no-store, max-age=0.
                CDN harus bypass cache.'
              schema:
                type: string
                example: no-store, max-age=0
            X-Request-Id:
              description: ID tracing nonrahasia; sama dengan request_id JSON.
              schema:
                type: string
        '410':
          description: QR retired.
          headers:
            Cache-Control:
              description: 'Semua JSON, HTML dan unduhan: no-store. Semua resolver responses: no-store, max-age=0.
                CDN harus bypass cache.'
              schema:
                type: string
                example: no-store, max-age=0
            X-Request-Id:
              description: ID tracing nonrahasia; sama dengan request_id JSON.
              schema:
                type: string
        '429':
          description: Terlalu banyak request.
          headers:
            Cache-Control:
              description: 'Semua JSON, HTML dan unduhan: no-store. Semua resolver responses: no-store, max-age=0.
                CDN harus bypass cache.'
              schema:
                type: string
                example: no-store, max-age=0
            X-Request-Id:
              description: ID tracing nonrahasia; sama dengan request_id JSON.
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '503':
          description: Database/resolver tidak tersedia; coba lagi.
          headers:
            Cache-Control:
              description: 'Semua JSON, HTML dan unduhan: no-store. Semua resolver responses: no-store, max-age=0.
                CDN harus bypass cache.'
              schema:
                type: string
                example: no-store, max-age=0
            X-Request-Id:
              description: ID tracing nonrahasia; sama dengan request_id JSON.
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
                minimum: 1
                example: 5
components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: Supabase JWT
      description: User access token valid plus authorization ADMIN; bukan service-role key.
    OwnerCookie:
      type: apiKey
      in: cookie
      name: __Host-owner_session
      description: Opaque session bound satu QR; dibentuk melalui login PIN.
  parameters:
    Token:
      name: token
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PublicToken'
    QrId:
      name: qr_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BatchId:
      name: batch_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExportId:
      name: export_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 1024
      description: 'Opaque cursor. Sort created_at DESC, id DESC; filter terikat cursor. Cursor salah atau filter
        berubah: 400 INVALID_CURSOR.'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 'UUID acak per operasi. Payload/key mismatch: 409. Normal retention 24 jam; support grant/rotasi
        secret 15 menit. Tidak digunakan untuk login atau PIN change.'
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
        pattern: ^"v[1-9][0-9]*"$
      description: Strong ETag resource dari GET. Wajib salah satu dari If-Match atau X-QR-If-Match. Hilang 428; versi usang 412. Evaluasi atomik bersama mutasi. Untuk deployment di balik proxy, gunakan X-QR-If-Match.
    QrIfMatch:
      name: X-QR-If-Match
      in: header
      required: false
      schema:
        type: string
        pattern: ^"v[1-9][0-9]*"$
      description: Alias If-Match untuk versi QR, diperiksa atomik oleh aplikasi tanpa evaluasi kondisi HTTP oleh proxy. Wajib salah satu header versi; jika keduanya dikirim nilainya harus sama.
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
      description: Token dari login atau GET /owner/me. Harus cocok dengan sesi. Origin juga diperiksa.
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
      description: 'Harus persis origin deployment terkonfigurasi. Berlaku pada seluruh public POST dan owner mutasi;
        origin lain atau hilang: 403. CLI/Postman menyetelnya eksplisit.'
  schemas:
    PublicToken:
      type: string
      pattern: ^[A-Za-z0-9_-]{22}$
      example: 7kR9mT2vX4pN6sQ8wY0zBA
      description: Base64url tanpa padding dari 16 byte random kriptografis; lookup case-sensitive.
    Pin:
      type: string
      pattern: ^[0-9]{4}$
      writeOnly: true
      example: '0427'
    ActivationCode:
      type: string
      pattern: ^[A-Z2-7]{16}$
      writeOnly: true
      example: MZXW6YTBOI2DEZLG
      description: 16 karakter Base32 random independen; client menghapus spasi/tanda hubung dan mengubah menjadi
        uppercase sebelum dikirim.
    ReviewUrl:
      type: string
      format: uri
      maxLength: 2048
      example: https://g.page/r/EXAMPLECODE/review
      description: Hanya HTTPS; pola link review yang ditetapkan dalam info.description. Contoh dummy, bukan toko
        nyata.
    QrStatus:
      type: string
      enum:
      - UNACTIVATED
      - ACTIVE
      - SUSPENDED
      - RETIRED
    StockStatus:
      type: string
      enum:
      - GENERATED
      - AVAILABLE
      - SOLD
      - DAMAGED
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
              - MALFORMED_JSON
              - INVALID_CURSOR
              - INVALID_PARAMETER
              - UNAUTHENTICATED
              - SESSION_EXPIRED
              - INVALID_CREDENTIALS
              - INVALID_ACTIVATION_CODE
              - FORBIDDEN
              - ORIGIN_NOT_ALLOWED
              - CSRF_INVALID
              - RESOURCE_NOT_FOUND
              - SALE_NOT_FOUND
              - STATE_CONFLICT
              - IDEMPOTENCY_KEY_REUSED
              - REQUEST_IN_PROGRESS
              - QR_STATE_CHANGED
              - QR_NOT_SOLD
              - QR_ALREADY_ACTIVE
              - QR_TRANSITION_INVALID
              - STOCK_TRANSITION_INVALID
              - ACTIVATION_EXPORT_UNAVAILABLE
              - EXPORT_NOT_READY
              - QR_RETIRED
              - GRANT_INVALID_OR_EXPIRED
              - EXPORT_EXPIRED
              - SECRET_REPLAY_EXPIRED
              - VERSION_MISMATCH
              - PAYLOAD_TOO_LARGE
              - UNSUPPORTED_MEDIA_TYPE
              - VALIDATION_ERROR
              - UNSUPPORTED_REVIEW_URL
              - PIN_CONFIRMATION_MISMATCH
              - QR_SUSPENDED
              - PRECONDITION_REQUIRED
              - RATE_LIMITED
              - INTERNAL_ERROR
              - SERVICE_UNAVAILABLE
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
                required:
                - field
                - code
                - message
          required:
          - code
          - message
        request_id:
          type: string
      required:
      - error
      - request_id
    Pagination:
      type: object
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        next_cursor:
          type: string
          nullable: true
      required:
      - limit
      - next_cursor
    Batch:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          minLength: 1
          maxLength: 120
        quantity:
          type: integer
          minimum: 1
          maximum: 500
        created_at:
          type: string
          format: date-time
        activation_codes_expires_at:
          type: string
          format: date-time
      required:
      - id
      - label
      - quantity
      - created_at
      - activation_codes_expires_at
    BatchCreate:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        quantity:
          type: integer
          minimum: 1
          maximum: 500
      required:
      - label
      - quantity
    ExportCreate:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - PUBLIC_QR
          - ACTIVATION_CODES
        image_format:
          type: string
          enum:
          - png
          - svg
          default: png
        size_px:
          type: integer
          minimum: 256
          maximum: 2048
          default: 1024
      required:
      - kind
    ExportJob:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - PUBLIC_QR
          - ACTIVATION_CODES
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - READY
          - FAILED
          - EXPIRED
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        download_path:
          type: string
          nullable: true
        failure_code:
          type: string
          nullable: true
      required:
      - id
      - batch_id
      - kind
      - status
      - created_at
      - expires_at
      - download_path
      - failure_code
    QrAdmin:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        token:
          $ref: '#/components/schemas/PublicToken'
        public_url:
          type: string
          format: uri
        status:
          $ref: '#/components/schemas/QrStatus'
        stock_status:
          $ref: '#/components/schemas/StockStatus'
        store_name:
          type: string
          minLength: 1
          maxLength: 120
          example: Kopi Bahagia
          description: Trim whitespace tepi; panjang dihitung setelah trim.
          nullable: true
        review_url:
          type: string
          format: uri
          maxLength: 2048
          example: https://g.page/r/EXAMPLECODE/review
          description: Hanya HTTPS; pola link review yang ditetapkan dalam info.description. Contoh dummy, bukan
            toko nyata.
          nullable: true
        version:
          type: integer
          minimum: 1
        ownership_id:
          type: string
          format: uuid
          nullable: true
        activated_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
