openapi: 3.0.3
info:
  title: Akrilik QR Review API
  version: 0.1.0
  description: 'Kontrak draft MVP v0.1 berdasarkan PRD 2 Oktober 2026. Bukan API yang sudah diimplementasikan. Endpoint
    /api/v1 dipakai browser Next.js atau backend pengganti di masa depan; /r/{token} tetap URL publik cetak. Server
    URL contoh harus diganti domain sendiri.


    Admin: Authorization Bearer access token Supabase Auth. Server verifikasi signature, expiry, issuer dan audience
    lalu periksa role admin dari sumber terpercaya; jangan percaya role user_metadata. Login/logout/refresh Supabase
    Auth di luar kontrak aplikasi ini. Jangan mengirim secret/service-role key dari browser.


    Owner: cookie opaque __Host-owner_session bound ke satu QR, ownership_id dan auth_generation. HttpOnly, Secure,
    SameSite=Strict, Path=/; expiry 30 menit. API owner pada origin yang sama dengan frontend. Unsafe cookie requests
    memerlukan Origin allowlisted dan X-CSRF-Token. Public POST login/aktivasi/claim memerlukan Origin allowlisted
    juga (untuk login CSRF); pembatasan origin tidak menggantikan verifikasi kode/PIN dan bukan bukti kepemilikan.
    Seluruh endpoint memaksa HTTPS.


    Semua body JSON menolak field tak dikenal dan null kecuali schema nullable; input tak ada dan null berbeda.
    Body maksimal 16 KiB (di luar layanan Auth). Timestamp RFC3339 UTC; id UUID; pin string empat digit termasuk
    nol awal. Nama trim sebelum panjang divalidasi. Aktivasi kode canonical Base32 16 karakter.


    GOOGLE_REVIEW_V1 adalah kebijakan produk: menerima hanya HTTPS exact host g.page dengan path /r/{code}/review
    (code [A-Za-z0-9_-]{1,200}, tanpa query atau fragment), atau exact host search.google.com, path /local/writereview,
    satu query placeid ([A-Za-z0-9_-]{1,255}); tanpa query lain atau fragment. Tolak userinfo, port selain default
    443, trailing-dot host, control characters, percent-encoded path/separator dan host alternatif. Scheme/host
    dinormalisasi lower-case dan port 443 dihapus; path/ID case-sensitive. Server tidak fetch URL dan tidak mengikuti
    short-link pada MVP; maps.app.goo.gl, goo.gl/maps, lokasi Maps umum dan host/pola lain: 422 UNSUPPORTED_REVIEW_URL.
    Kebijakan ini tidak menjamin link masih hidup atau toko benar; sales/owner harus tes tujuan di browser. Format
    dapat berkembang dengan versi policy baru; bukan klaim semua link Google selalu mempunyai bentuk ini.


    Errors JSON: {error:{code,message,details?},request_id}. Tidak ada stack trace, PIN, hash atau kode rahasia.
    Limit: lima kegagalan kredensial per token+source dalam 15 menit lalu cooldown 15 menit; limit tambahan per
    sumber dan lintas sumber pada shared store. 429 Retry-After detik. API umum 120 request/menit per principal
    atau sumber; resolver 300/menit per sumber sebagai default pilot (shared NAT perlu ditinjau). Audit/log tidak
    menyimpan body sensitif; sumber IP untuk limiter hanya dari proxy terpercaya.


    GET list memakai limit 1..100 (default 20), cursor opaque, urutan created_at DESC,id DESC. QR version naik untuk
    mutasi domain termasuk penerbitan grant dukungan, bukan analytics/sesi login atau pembuatan export; kuat If-Match
    melindungi lost update. If-Match hilang 428, usang 412. Audit, state dan versi ditulis dalam satu transaksi.


    Idempotency-Key UUID wajib pada operasi yang mendefinisikannya. Scope admin user+method+path; public token/grant+method+path.
    Fingerprint payload dan If-Match dibuat dengan HMAC server; PIN/secret tidak disimpan plaintext dalam rekaman.
    Setelah auth/origin checks, replay dicek sebelum If-Match/state. Untuk aktivasi/claim, credential yang sudah
    consumed hanya sah bagi replay key+fingerprint yang tersimpan; jangan menolak replay sukses hanya karena kode/grant
    telah dikonsumsi. Verifikasi HMAC cocok dengan credential awal dan generation hasil commit; key baru tetap tidak
    bisa memakai kode/grant consumed. Key sama payload beda 409 IDEMPOTENCY_KEY_REUSED; masih berjalan 409 REQUEST_IN_PROGRESS
    dengan Retry-After=2. Normal retention 24 jam; dukungan/grant/rotasi yang mengandung secret memakai 15 menit
    dan encrypted response. Replay sekret yang kedaluwarsa tidak menciptakan grant/kode baru: 410 SECRET_REPLAY_EXPIRED
    selama tombstone key 24 jam. 4xx tanpa commit tidak menyimpan sukses; key baru diperlukan jika payload diperbaiki.
    Replay publik setelah generation/ownership/status terkait berubah ditolak 409 QR_STATE_CHANGED, bukan menghidupkan
    sesi/kode lama. Setelah retention habis, invariant QR/penjualan tetap mencegah duplikasi; batch key expired
    dapat menciptakan batch baru jadi cek list sebelum retry sangat terlambat.


    QR visits adalah durable GET resolver ACTIVE, mengecualikan HEAD, bot yang dikenali dan trafik uji deployment.
    Tidak dapat membuktikan review terkirim/orang unik. Jangan izinkan query test=true untuk suppress statistik
    publik. Insert event secara best effort dengan batas waktu terpisah; failure tidak menggagalkan redirect. Timestamp
    dan ownership_id diambil dari hasil resolve yang sama supaya scan yang bersamaan transfer tidak masuk periode
    baru secara keliru. Agregasi durable maksimal lag 60 detik; minimal fields ownership_id,total_visits,last_visited_at,as_of.
    Sesi/secret/reset tidak masuk analytics. Raw scan events retention 90 hari, agregat periode terpisah tidak dihapus
    saat transfer.


    Semua response Cache-Control no-store dan X-Request-Id; /r semua status juga max-age=0. Tidak menerima return_to/destination
    URL pada resolver. Support UI menangani #grant fragment dan segera menghapus fragment dari address bar; halaman
    menggunakan Referrer-Policy no-referrer dan tidak memuat analytics pihak ketiga. Secret grant TTL 15 menit dan
    sekali pakai. Suspend/retire/PIN change/claim mencabut sesi. RETIRED terminal; DAMAGED stock terminal dan otomatis
    retire QR. Resumption tidak mengembalikan sesi atau grant lama.

    '
servers:
- url: https://qr.example.com
  description: Placeholder produksi; ganti origin sendiri.
- url: https://localhost:3000
  description: Dev dengan HTTPS lokal agar Secure cookie berfungsi.
tags:
- name: Admin
- name: Batch
- name: Inventory
- name: Support
- name: Public
- name: Owner
- name: Resolver
paths:
  /api/v1/admin/me:
    get:
      operationId: adminMe
      summary: Identitas dan peran admin
      description: JWT Supabase valid tidak otomatis berarti admin. Server memeriksa role/allowlist admin pada data
        yang tidak dapat diubah pengguna.
      tags:
      - Admin
      security:
      - AdminBearer: []
      parameters: []
      responses:
        '200':
          description: Berhasil.
          headers:
            Cache-Control:
              description: 'Semua JSON, HTML dan unduhan: no-store. Semua resolver responses: no-store, max-age=0.
                CDN harus bypass cache.'
              schema:
                type: string
                example: no-store
            X-Request-Id:
              description: ID tracing nonrahasia; sama dengan request_id JSON.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMeResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/admin/dashboard:
    get:
      operationId: adminDashboard
      summary: Ringkasan stok dan status QR
      description: ''
      tags:
      - Admin
      security:
      - AdminBearer: []
      parameters: []
      responses:
        '200':
          description: Berhasil.
          headers:
            Cache-Control:
              description: 'Semua JSON, HTML dan unduhan: no-store. Semua resolver responses: no-store, max-age=0.
                CDN harus bypass cache.'
              schema:
                type: string
                example: no-store
            X-Request-Id:
              description: ID tracing nonrahasia; sama dengan request_id JSON.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/admin/batches:
    post:
      operationId: createBatch
      summary: Buat batch QR unik
      description: Semua unit, hash kode dan snapshot terenkripsi rahasia 24 jam dibuat atomik sebelum 201. Tidak
        mengirim raw code dalam JSON batch. Jika gagal, tidak ada batch parsial. Label tidak harus unik. Status
        unit GENERATED dan QR UNACTIVATED.
      tags:
      - Batch
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Berhasil.
          headers:
            Cache-Control:
              description: 'Semua JSON, HTML dan unduhan: no-store. Semua resolver responses: no-store, max-age=0.
                CDN harus bypass cache.'
              schema:
                type: string
                example: no-store
            X-Request-Id:
              description: ID tracing nonrahasia; sama dengan request_id JSON.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '413':
          $ref: '#/components/responses/Error413'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreate'
            example:
              label: Produksi Oktober 2026
              quantity: 100
    get:
      operationId: listBatches
      summary: Daftar batch
      description: ''
      tags:
      - Batch
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Berhasil.
          headers:
            Cache-Control:
              description: 'Semua JSON, HTML dan unduhan: no-store. Semua resolver responses: no-store, max-age=0.
                CDN harus bypass cache.'
              schema:
                type: string
                example: no-store
            X-Request-Id:
              description: ID tracing nonrahasia; sama dengan request_id JSON.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchListResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/admin/batches/{batch_id}:
    get:
      operationId: getBatch
      summary: Detail batch
      description: ''
      tags:
      - Batch
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Berhasil.
          headers:
            Cache-Control:
              description: 'Semua JSON, HTML dan unduhan: no-store. Semua resolver responses: no-store, max-age=0.
                CDN harus bypass cache.'
              schema:
                type: string
                example: no-store
            X-Request-Id:
              description: ID tracing nonrahasia; sama dengan request_id JSON.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/admin/batches/{batch_id}/exports:
    post:
      operationId: createExport
      summary: Antrekan ZIP produksi atau kode rahasia
      description: 'PUBLIC_QR: ZIP berisi manifest.csv dan QR PNG/SVG URL publik, tanpa kode rahasia. ACTIVATION_CODES:
        ZIP terpisah berisi activation-codes.csv (token,activation_code). Opsi gambar hanya berlaku PUBLIC_QR; bila
        disertakan pada ACTIVATION_CODES, 422. Kode rahasia hanya dapat diekspor sebelum snapshot 24 jam berakhir
        dan sebelum ada unit batch yang aktif, retired atau kodenya dirotasi. Snapshot yang tidak lagi valid: 409
        ACTIVATION_EXPORT_UNAVAILABLE. Pekerja harus memeriksa ulang sebelum membuat dan mengunduh arsip. Secret
        tidak melewati URL publik. Jangan memasukkan arsip rahasia ke vendor cetak QR.'
      tags:
      - Batch
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/BatchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Berhasil.
          headers:
            Cache-Control:
              description: 'Semua JSON, HTML dan unduhan: no-store. Semua resolver responses: no-store, max-age=0.
                CDN harus bypass cache.'
              schema:
                type: string
                example: no-store
            X-Request-Id:
              description: ID tracing nonrahasia; sama dengan request_id JSON.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '413':
          $ref: '#/components/responses/Error413'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportCreate'
  /api/v1/admin/exports/{export_id}:
    get:
      operationId: getExport
      summary: Status job ekspor
      description: Polling setiap 2 detik. FAILED tidak membatalkan batch. EXPIRED atau snapshot invalid mengosongkan
        download_path. Retry job gagal memakai Idempotency-Key baru; retry jaringan memakai key lama.
      tags:
      - Batch
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: Berhasil.
          headers:
            Cache-Control:
              description: 'Semua JSON, HTML dan unduhan: no-store. Semua resolver responses: no-store, max-age=0.
                CDN harus bypass cache.'
              schema:
                type: string
                example: no-store
            X-Request-Id:
              description: ID tracing nonrahasia; sama dengan request_id JSON.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/admin/exports/{export_id}/download:
    get:
      operationId: downloadExport
      summary: Unduh ZIP melalui server
      description: 'READY saja; QUEUED/RUNNING/FAILED: 409 EXPORT_NOT_READY; expired: 410 EXPORT_EXPIRED. Semua
        arsip TTL maksimal 24 jam dari job dan arsip kode tidak melewati TTL snapshot batch. Download diproxy setelah
        otorisasi; tidak memberikan signed URL publik. Tidak mendukung range/resume pada MVP.'
      tags:
      - Batch
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: Berhasil.
          headers:
            Cache-Control:
              description: 'Semua JSON, HTML dan unduhan: no-store. Semua resolver responses: no-store, max-age=0.
                CDN harus bypass cache.'
              schema:
                type: string
                example: no-store
            X-Request-Id:
              description: ID tracing nonrahasia; sama dengan request_id JSON.
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="qr-public.zip"
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/admin/qr-codes:
    get:
      operationId: listQr
      summary: Cari QR dan stok
      description: ''
      tags:
      - Inventory
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: search
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 120
        description: Cari exact token atau substring nama toko case-insensitive.
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/QrStatus'
        description: ''
      - name: stock_status
        in: query
        schema:
          $ref: '#/components/schemas/StockStatus'
        description: ''
      - name: batch_id
        in: query
        schema:
          type: string
          format: uuid
        description: ''
      responses:
        '200':
          description: Berhasil.
          headers:
            Cache-Control:
              description: 'Semua JSON, HTML dan unduhan: no-store. Semua resolver responses: no-store, max-age=0.
                CDN harus bypass cache.'
              schema:
                type: string
                example: no-store
            X-Request-Id:
              description: ID tracing nonrahasia; sama dengan request_id JSON.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrAdminListResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/admin/qr-codes/{qr_id}:
    get:
      operationId: getQrAdmin
      summary: Detail QR dan versi
      description: ''
      tags:
      - Inventory
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/QrId'
      responses:
        '200':
          description: Berhasil.
          headers:
            Cache-Control:
              description: 'Semua JSON, HTML dan unduhan: no-store. Semua resolver responses: no-store, max-age=0.
                CDN harus bypass cache.'
              schema:
                type: string
                example: no-store
            X-Request-Id:
              description: ID tracing nonrahasia; sama dengan request_id JSON.
              schema:
                type: string
            ETag:
              description: Versi QR resource; format strong ETag seperti "v7". Gunakan persis pada If-Match.
              schema:
                type: string
                example: '"v7"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrAdminResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/admin/qr-codes/{qr_id}/image:
    get:
      operationId: getQrImage
      summary: Gambar QR publik per unit
      description: URL yang dikodekan selalu {configured_public_origin}/r/{token}. Quiet zone minimal 4 modul, hitam
        di atas putih, koreksi error M. SVG menggunakan size_px sebagai dimensi/viewBox dan tidak memuat script
        atau input HTML.
      tags:
      - Inventory
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/QrId'
      - name: format
        in: query
        schema:
          type: string
          enum:
          - png
          - svg
          default: png
        description: ''
      - name: size_px
        in: query
        schema:
          type: integer
          minimum: 256
          maximum: 2048
          default: 1024
        description: ''
      responses:
        '200':
          description: Berhasil.
          headers:
            Cache-Control:
              description: 'Semua JSON, HTML dan unduhan: no-store. Semua resolver responses: no-store, max-age=0.
                CDN harus bypass cache.'
              schema:
                type: string
                example: no-store
            X-Request-Id:
              description: ID tracing nonrahasia; sama dengan request_id JSON.
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/admin/qr-codes/{qr_id}/stock:
    patch:
      operationId: updateStock
      summary: Tandai stok tersedia atau rusak
      description: 'GENERATED → AVAILABLE atau DAMAGED; AVAILABLE → DAMAGED. QR harus UNACTIVATED. DAMAGED terminal
        untuk stok, SOLD tidak dapat diubah di sini. Pada DAMAGED server juga mengubah QR ke RETIRED dan mencabut
        kode; semua dilakukan atomik. Tindakan ke status yang sama: 409 STOCK_TRANSITION_INVALID.'
      tags:
      - Inventory
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/QrId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/QrIfMatch'
      responses:
        '200':
          description: Berhasil.
          headers:
            Cache-Control:
              description: 'Semua JSON, HTML dan unduhan: no-store. Semua resolver responses: no-store, max-age=0.
                CDN harus bypass cache.'
              schema:
