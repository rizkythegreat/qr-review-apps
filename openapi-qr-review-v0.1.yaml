        new_pin_confirmation:
          $ref: '#/components/schemas/Pin'
      required:
      - grant_token
      - new_pin
      - new_pin_confirmation
    TransferClaim:
      type: object
      additionalProperties: false
      properties:
        grant_token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: true
        store_name:
          type: string
          minLength: 1
          maxLength: 120
          example: Kopi Bahagia
          description: Trim whitespace tepi; panjang dihitung setelah trim.
        review_url:
          $ref: '#/components/schemas/ReviewUrl'
        new_pin:
          $ref: '#/components/schemas/Pin'
        new_pin_confirmation:
          $ref: '#/components/schemas/Pin'
      required:
      - grant_token
      - store_name
      - review_url
      - new_pin
      - new_pin_confirmation
    ClaimResult:
      type: object
      additionalProperties: false
      properties:
        token:
          $ref: '#/components/schemas/PublicToken'
        status:
          $ref: '#/components/schemas/QrStatus'
        manage_url:
          type: string
          format: uri
        completed_at:
          type: string
          format: date-time
      required:
      - token
      - status
      - manage_url
      - completed_at
    RotatedCode:
      type: object
      additionalProperties: false
      properties:
        qr_id:
          type: string
          format: uuid
        activation_code:
          type: string
          pattern: ^[A-Z2-7]{16}$
          description: Rahasia baru ditampilkan pada response ini; jangan log.
        version:
          type: integer
          minimum: 1
      required:
      - qr_id
      - activation_code
      - version
      description: Print label rahasia baru. Token publik dan QR cetak tetap sama.
    AuditEvent:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        qr_id:
          type: string
          format: uuid
        action:
          type: string
        actor_type:
          type: string
          enum:
          - ADMIN
          - OWNER
          - SYSTEM
        actor_id:
