  /api/v1/admin/audit-events:
    get:
      operationId: listActivity
      summary: Log aktivitas seluruh QR
      description: Riwayat seluruh QR, terbaru dahulu. Pencarian memakai token atau ID
        QR persis, atau bagian nama toko saat ini. Tanggal from/to inklusif dalam
        WIB (Asia/Jakarta); from harus tidak lebih besar dari to. Cursor terikat
        pada seluruh filter. Tidak mencatat login atau kunjungan scan.
      tags:
        - Support
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - in: query
          name: search
          schema:
            type: string
            minLength: 1
            maxLength: 120
          description: Token, ID QR, atau nama toko saat ini.
        - in: query
          name: action
          schema:
            type: string
            enum:
              - BATCH_GENERATED
              - STOCK_AVAILABLE
              - STOCK_DAMAGED
              - SALE_RECORDED
              - ACTIVATED
              - OWNER_UPDATED
              - PIN_CHANGED
              - PIN_RESET_GRANT_CREATED
              - OWNERSHIP_TRANSFER_GRANT_CREATED
              - PIN_RESET_CLAIMED
              - OWNERSHIP_TRANSFER_CLAIMED
              - suspendQr
              - resumeQr
              - retireQr
              - ACTIVATION_CODE_ROTATED
              - SUSPENDED
              - RESUMED
              - RETIRED
          description: Jenis tindakan. suspendQr/resumeQr/retireQr juga mencakup nama
            historis SUSPENDED/RESUMED/RETIRED.
        - in: query
          name: from
          schema:
            type: string
            format: date
          description: Tanggal inklusif dalam WIB, YYYY-MM-DD.
        - in: query
          name: to
          schema:
            type: string
            format: date
          description: Tanggal inklusif dalam WIB, YYYY-MM-DD.
      responses:
        "200":
          description: Berhasil.
          headers:
            Cache-Control:
              description: "Semua JSON, HTML dan unduhan: no-store. Semua resolver responses:
