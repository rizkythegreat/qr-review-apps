      - reason
    SupportGrantCreate:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 500
          example: Pemilik meminta pemulihan setelah PIN terlupa.
        verification_reference:
          type: string
          minLength: 5
          maxLength: 200
          example: SUPPORT-20261002-001
          description: Referensi pemeriksaan bukti; jangan menaruh foto/dokumen pribadi dalam field ini.
      required:
      - reason
      - verification_reference
    SupportGrant:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        qr_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - PIN_RESET
          - OWNERSHIP_TRANSFER
        expires_at:
          type: string
          format: date-time
        claim_url:
          type: string
          format: uri
        qr_version:
          type: integer
          minimum: 1
